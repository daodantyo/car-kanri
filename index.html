function pdg(x){return x*Math.PI/180;} function prd(x){return x*180/Math.PI;}
function dsin(x){return Math.sin(pdg(x));} function dcos(x){return Math.cos(pdg(x));} function dtan(x){return Math.tan(pdg(x));}
function darcsin(x){return prd(Math.asin(x));} function darccos(x){return prd(Math.acos(x));}
function darctan2(y,x){return prd(Math.atan2(y,x));} function darccot(x){return prd(Math.atan2(1,x));}
function fixA(a){a=a-360*Math.floor(a/360); return a<0?a+360:a;}
function fixH(a){a=a-24*Math.floor(a/24); return a<0?a+24:a;}
function julianDate(y,m,d){ if(m<=2){y-=1;m+=12;} const A=Math.floor(y/100), B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){ const D=jd-2451545.0; const g=fixA(357.529+0.98560028*D); const q=fixA(280.459+0.98564736*D); const Ls=fixA(q+1.915*dsin(g)+0.020*dsin(2*g)); const e=23.439-0.00000036*D; const RA=darctan2(dcos(e)*dsin(Ls),dcos(Ls))/15; const decl=darcsin(dsin(e)*dsin(Ls)); const EqT=q/15-fixH(RA); return {decl:decl,EqT:EqT}; }
function timeAngle(angle,lat,decl){ const x=(dsin(angle)-dsin(lat)*dsin(decl))/(dcos(lat)*dcos(decl)); if(x< -1||x>1) return null; return darccos(x)/15; }
function computePrayer(lat,lng,tz,dateObj){
  const y=dateObj.getFullYear(), m=dateObj.getMonth()+1, d=dateObj.getDate();
  const jd=julianDate(y,m,d) - lng/(15*24);
  const sp=sunPos(jd); const decl=sp.decl, eqt=sp.EqT;
  const dhuhr=fixH(12 + tz - lng/15 - eqt);
  function Tm(angle,sign){ const t=timeAngle(angle,lat,decl); if(t===null) return null; return dhuhr + sign*t; }
  const asrA=-darccot(1+dtan(Math.abs(lat-decl)));
  const asrT=timeAngle(asrA,lat,decl);
  return { fajr:Tm(-18,-1), sunrise:Tm(-0.833,-1), dhuhr:dhuhr, asr:(asrT===null?null:dhuhr+asrT), maghrib:Tm(-0.833,1), isha:Tm(-17,1) };
}
function hm(h){ if(h===null||isNaN(h)) return "--:--"; h=fixH(h); let hh=Math.floor(h); let mm=Math.round((h-hh)*60); if(mm===60){mm=0;hh=(hh+1)%24;} return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }
function setupPrayerTimer(){ if(prayerTimer) clearInterval(prayerTimer); prayerTimer=setInterval(function(){ if(currentUser && !isAdmin && ui.tab==="prayer"){ render(); } else { clearInterval(prayerTimer); prayerTimer=null; } }, 60000); }
function prayerHtml(){
  let h='';
  h += '<div class="card" style="padding:14px;margin-bottom:16px;">';
  h += '<label>'+t("chooseCity")+'</label>';
  h += '<select onchange="pickCity(this.value)"><option value="">—</option>';
  CITIES.forEach(function(c,i){ const sel=(prayerLoc && prayerLoc.name===cityLabel(c))?" selected":""; h+='<option value="'+i+'"'+sel+'>'+esc(cityLabel(c))+'</option>'; });
  h += '</select>';
  h += '<button class="submit dark" style="margin-top:4px;" onclick="useLocation()">📍 '+t("useLocation")+'</button>';
  h += '</div>';
  if(!prayerLoc) return h;
  const now=new Date();
  const T=computePrayer(prayerLoc.lat,prayerLoc.lng,prayerLoc.tz,now);
  const utcH=now.getUTCHours()+now.getUTCMinutes()/60;
  const localH=fixH(utcH+prayerLoc.tz);
  const only=[["pFajr",T.fajr],["pDhuhr",T.dhuhr],["pAsr",T.asr],["pMaghrib",T.maghrib],["pIsha",T.isha]];
  let nextName=null,nextT=null;
  for(let i=0;i<only.length;i++){ if(only[i][1]!==null && only[i][1]>localH){ nextName=only[i][0]; nextT=only[i][1]; break; } }
  if(nextName===null && only[0][1]!==null){ nextName=only[0][0]; nextT=only[0][1]+24; }
  h += '<div class="total dark" style="text-align:center;"><div class="l">🕌 '+esc(prayerLoc.name)+'</div>';
  if(nextName!==null){ const rem=nextT-localH; const rh=Math.floor(rem), rm=Math.round((rem-rh)*60);
    h += '<div style="font-size:13px;opacity:.85;margin-top:6px;">'+t("nextPrayer")+'：'+t(nextName)+'</div>';
    h += '<div class="n" style="font-size:24px;">'+t("remain")+' '+rh+'h '+String(rm<0?0:rm).padStart(2,"0")+'m</div>'; }
  h += '</div>';
  const all=[["pFajr",T.fajr],["pSunrise",T.sunrise],["pDhuhr",T.dhuhr],["pAsr",T.asr],["pMaghrib",T.maghrib],["pIsha",T.isha]];
  all.forEach(function(row){ const isNext=(row[0]===nextName);
    h+='<div class="praytime'+(isNext?" next":"")+'"><div class="prayname">'+t(row[0])+'</div><div class="praytm">'+hm(row[1])+'</div></div>'; });
  return h;
}

// 予定を Googleカレンダー登録リンクに変換
function gcalUrl(s){
  const d = (s.date||"").split("-").join(""); // YYYYMMDD
  let dates;
  if(s.time){
    const hm = s.time.split(":");
    const startH = String(hm[0]).padStart(2,"0"), startM = String(hm[1]).padStart(2,"0");
    // 1時間の予定として登録
    let eh = (Number(hm[0])+1);
    let ed = d;
    if(eh>=24){ eh=eh-24; const dt=new Date(Number(s.date.slice(0,4)), Number(s.date.slice(5,7))-1, Number(s.date.slice(8,10))+1); ed = dt.getFullYear()+String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0"); }
    const endH = String(eh).padStart(2,"0");
    dates = d+"T"+startH+startM+"00/"+ed+"T"+endH+startM+"00";
  } else {
    dates = d+"/"+d; // 終日
  }
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(s.text||"") + "&dates=" + dates;
}

function addPhoto(d){ const id="p"+Date.now()+Math.floor(Math.random()*10000); photos[id]=d; savePhotos(); return id; }
function getPhoto(id){ return photos[id]||null; }
function readImage(file, cb, max, q){
  max=max||800; q=q||0.7;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      let w=img.width, h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",q));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

    const now=new Date();
    const ymd=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

      if(s.date===ymd && s.time===hm && !notifiedIds[s.id]){
        try{ new Notification(t("notifyTitle"),{ body:s.text }); }catch(e){}
        notifiedIds[s.id]=1;

      }
    });
  } catch(e){}
}

    + '<label>'+t("fMemo")+'</label><input type="text" id="v_memo" placeholder="'+esc(t("phMemoCar"))+'">'
    + '<label>'+t("photo")+'</label><div id="vphotos"></div>'
    + '<label class="addrow" style="cursor:pointer;display:block;text-align:center;">'+t("addPhoto")+'<input type="file" accept="image/*" style="display:none;" onchange="onPickPhoto(this,\'v\')"></label>'
    + '<button class="submit dark" onclick="submitVehicle()">'+t("savePurchase")+'</button>'
    + '</div></div>';
  openModal(html);
}
function submitVehicle(){
  const model = document.getElementById("v_model").value.trim();
  if(!model){ alert(t("alModel")); return; }
  db.vehicles.push({
    id:Date.now(), date:document.getElementById("v_date").value, model:model,
    grade:document.getElementById("v_grade").value.trim(),
    mileage:Number(document.getElementById("v_mileage").value)||0,
    cost:Number(document.getElementById("v_cost").value)||0,
    memo:document.getElementById("v_memo").value.trim(), photos:vformPhotos
  });
  save(); closeModal(); render();
}

function openModal(html){ const d=document.createElement("div"); d.id="modal"; d.innerHTML=html; document.body.appendChild(d); }
function closeModal(ev){ if(ev && ev.target!==ev.currentTarget) return; const m=document.getElementById("modal"); if(m) m.remove(); }

// ====== 見積書・請求書 ======
let doc = null;
function openDoc(){
  const list = curList();
  doc = {
    type:"quote", issuer:{ name:"", address:"", tel:"", bank:"" }, to:"", note:"", due:"",
    items: list.length ? list.map(e=>({ category:e.category, desc:e.memo||catLabel(catOf(e.category)), qty:1, price:Number(e.amount) }))
                       : [{ category:"部品", desc:"", qty:1, price:0 }]
  };
  renderDoc();
}
function closeDoc(){ const m=document.getElementById("docmodal"); if(m) m.remove(); doc=null; }
function setDocType(ty){ doc.type=ty; renderDoc(); }
function docField(k,v){ doc[k]=v; }
function docIssuer(k,v){ doc.issuer[k]=v; }
function docItem(i,k,v){ doc.items[i][k]=v; renderDocPreviewOnly(); }
function addDocRow(){ doc.items.push({ category:"部品", desc:"", qty:1, price:0 }); renderDoc(); }
function delDocRow(i){ doc.items.splice(i,1); if(doc.items.length===0) doc.items.push({category:"部品",desc:"",qty:1,price:0}); renderDoc(); }
function docCalc(){ const sub = doc.items.reduce((s,it)=>s+Number(it.qty||0)*Number(it.price||0),0); const tax=Math.floor(sub*0.1); return { sub, tax, grand: sub+tax }; }

function renderDoc(){
  const isQ = doc.type==="quote";
  let controls = '<div class="no-print">'
    + '<div class="sheethead"><h2>'+t("docTitle")+'</h2><button class="xbtn" onclick="closeDoc()">✕</button></div>'
    + '<div class="doctypesw"><button class="'+(isQ?"on":"")+'" onclick="setDocType(\'quote\')">'+t("quote")+'</button>'
    + '<button class="'+(!isQ?"on":"")+'" onclick="setDocType(\'invoice\')">'+t("invoice")+'</button></div>'
    + '<label>'+t("to")+'</label><input type="text" value="'+esc(doc.to)+'" placeholder="'+esc(t("phTo"))+'" oninput="docField(\'to\',this.value); syncPrev()">'
    + '<div class="issuerbox"><div class="t">'+t("from")+'</div>'
    + '<input type="text" value="'+esc(doc.issuer.name)+'" placeholder="'+esc(t("phFromName"))+'" oninput="docIssuer(\'name\',this.value); syncPrev()">'
    + '<input type="text" value="'+esc(doc.issuer.address)+'" placeholder="'+esc(t("phFromAddr"))+'" oninput="docIssuer(\'address\',this.value); syncPrev()">'
    + '<input type="text" value="'+esc(doc.issuer.tel)+'" placeholder="'+esc(t("phFromTel"))+'" oninput="docIssuer(\'tel\',this.value); syncPrev()"></div>'
    + '<label>'+t("items")+'</label>' + itemsEditorHtml()
    + '<button class="addrow" onclick="addDocRow()">'+t("addItem")+'</button>';
  if(!isQ){
    controls += '<label>'+t("due")+'</label><input type="date" value="'+esc(doc.due)+'" oninput="docField(\'due\',this.value); syncPrev()">'
      + '<label>'+t("bank")+'</label><input type="text" value="'+esc(doc.issuer.bank)+'" placeholder="'+esc(t("phBank"))+'" oninput="docIssuer(\'bank\',this.value); syncPrev()">';
  }
  controls += '<label>'+t("note")+'</label><input type="text" value="'+esc(doc.note)+'" placeholder="'+esc(t("phNote"))+'" oninput="docField(\'note\',this.value); syncPrev()">'
    + '<div class="prevnote">'+t("prevNote")+'</div></div>';
  const paper = '<div id="docpaper">'+paperHtml()+'</div>';
  const btns = '<div class="no-print docbtns"><button class="close" onclick="closeDoc()">'+t("close")+'</button>'
    + '<button class="print" onclick="makePdf()">'+t("pdf")+'</button></div>';
  let m = document.getElementById("docmodal");
  if(!m){ m=document.createElement("div"); m.id="docmodal"; document.body.appendChild(m); }
  m.innerHTML = '<div class="docoverlay"><div class="docmodal">'+controls+paper+btns+'</div></div>';
}

function itemsEditorHtml(){
  return doc.items.map((it,i)=>{
    const opts = CATS.map(c=>'<option value="'+c.key+'"'+(it.category===c.key?" selected":"")+'>'+catLabel(c)+'</option>').join("");
    return '<div class="itemrow">'
      + '<div class="r1"><select onchange="docItem('+i+',\'category\',this.value)">'+opts+'</select>'
      + '<input class="desc" type="text" value="'+esc(it.desc)+'" placeholder="'+esc(t("phDesc"))+'" oninput="docItem('+i+',\'desc\',this.value)">'
      + '<button class="del" onclick="delDocRow('+i+')">🗑</button></div>'
      + '<div class="r2"><span class="lbl">'+t("qty")+'</span>'
      + '<input class="qty" type="number" inputmode="numeric" value="'+esc(it.qty)+'" oninput="docItem('+i+',\'qty\',this.value)">'
      + '<span class="lbl">'+t("unit")+'</span><div class="prcwrap"><span>¥</span>'
      + '<input class="prc" type="number" inputmode="numeric" value="'+esc(it.price)+'" oninput="docItem('+i+',\'price\',this.value)"></div></div>'
      + '</div>';
  }).join("");
}

function paperHtml(){
  const isQ = doc.type==="quote";
  const { sub, tax, grand } = docCalc();
  const dl = (lang==="ar"||lang==="ur") ? "en" : lang;
  const title = isQ ? td("pTitleQuote") : td("pTitleInvoice");
  const lead = isQ ? td("pLeadQuote") : td("pLeadInvoice");
  const no = (isQ?"Q-":"I-") + todayStr().split("-").join("");
  const toText = (dl==="ja") ? ((esc(doc.to)||"（宛先）")+' <span style="font-size:14px;font-weight:400;">'+td("onchu")+'</span>') : ("To: "+(esc(doc.to)||"(customer)"));
  let rows = doc.items.map(it=>{ const c=catOf(it.category); return '<tr><td>'+esc(catDoc(c))+'</td><td>'+esc(it.desc)+'</td>'
    + '<td class="ta-r">'+esc(it.qty)+'</td><td class="ta-r">'+yen(it.price)+'</td>'
    + '<td class="ta-r">'+yen(Number(it.qty||0)*Number(it.price||0))+'</td></tr>'; }).join("");
  let pay = "";
  if(!isQ && (doc.due || doc.issuer.bank)){
    pay = '<div class="docpay">'
      + (doc.due? '<div>'+td("dueP")+slash(doc.due)+'</div>':'')
      + (doc.issuer.bank? '<div style="margin-top:4px;">'+td("bankP")+esc(doc.issuer.bank)+'</div>':'')
      + '</div>';
  }
  return '<div class="sheetpaper" dir="ltr">'
    + '<div class="doctitle">'+title+'</div>'
    + '<div class="docheader"><div>'
      + '<div class="docto">'+toText+'</div>'
      + '<div class="doclead">'+lead+'</div>'
      + '<div class="docgrand"><div class="l">'+td("grand")+'</div><div class="n">'+yen(grand)+'</div></div>'
    + '</div><div class="docissuer"><div>'+td("noLbl")+' '+no+'</div><div>'+td("issueDate")+' '+slash(todayStr())+'</div>'
      + '<div class="name">'+(esc(doc.issuer.name)||(dl==="ja"?"（発行元の名前）":"(your name)"))+'</div>'
      + (doc.issuer.address? '<div>'+esc(doc.issuer.address)+'</div>':'')
      + (doc.issuer.tel? '<div>TEL '+esc(doc.issuer.tel)+'</div>':'')
    + '</div></div>'
    + '<table class="doctable"><thead><tr>'
      + '<th class="ta-l">'+td("thCat")+'</th><th class="ta-l">'+td("thDesc")+'</th><th class="ta-r">'+td("thQty")+'</th><th class="ta-r">'+td("thUnit")+'</th><th class="ta-r">'+td("thAmt")+'</th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table>'
    + '<div class="doctotals"><div class="box">'
      + '<div class="line"><span>'+td("subtotal")+'</span><span>'+yen(sub)+'</span></div>'
      + '<div class="line"><span>'+td("tax")+'</span><span>'+yen(tax)+'</span></div>'
      + '<div class="line grand"><span>'+td("totalRow")+'</span><span>'+yen(grand)+'</span></div>'
    + '</div></div>'
    + pay
    + (doc.note? '<div class="docmemo">'+td("noteP")+esc(doc.note)+'</div>':'')
    + '</div>';
}

function makePdf(){
  const el = document.querySelector("#docpaper .sheetpaper");
  if(!el) return;
  if(!window.html2canvas || !window.jspdf){ alert(t("alPdfNot")); return; }
  const isQ = doc.type==="quote";
  const fname = (isQ?"mitsumori_":"seikyu_") + todayStr().split("-").join("") + ".pdf";
  html2canvas(el, { scale:2, backgroundColor:"#ffffff" }).then(function(canvas){
    const img = canvas.toDataURL("image/png");
    const jsPDF = window.jspdf.jsPDF;
    const pdf = new jsPDF("p","mm","a4");
    const pw = 210, ph = 297, iw = pw;
    const ih = canvas.height * pw / canvas.width;
    let heightLeft = ih, position = 0;
    pdf.addImage(img,"PNG",0,position,iw,ih); heightLeft -= ph;
    while(heightLeft > 0){ position -= ph; pdf.addPage(); pdf.addImage(img,"PNG",0,position,iw,ih); heightLeft -= ph; }
    pdf.save(fname);
  }).catch(function(e){ alert(t("alPdfErr")); });
}

function renderDocPreviewOnly(){ const p=document.getElementById("docpaper"); if(p) p.innerHTML = paperHtml(); }
function syncPrev(){ renderDocPreviewOnly(); }

applyDir();
function boot(){
  let sess=null;
  try{ const s=localStorage.getItem("car-session"); if(s) sess=JSON.parse(s); }catch(_){}
  if(sess && sess.id){
    // まず保存済みログインを信じて復元（通信待ちでログアウトしない）
    currentUser=sess.id; isAdmin=!!sess.admin;
    document.getElementById("app").innerHTML = '<div style="padding:60px 20px;text-align:center;color:#94a3b8;">'+t("loading")+'</div>';
    fetchAccounts().then(function(){
      // 名簿がちゃんと取れて、その人が明確に削除されている場合だけログアウト
      if(accounts && Object.keys(accounts).length>0 && !accounts[sess.id]){
        currentUser=null; isAdmin=false; try{ localStorage.removeItem("car-session"); }catch(_){}
        showLogin(); return;
      }
      if(isAdmin){ showAdmin(); return; }
      loadUserData().then(function(){ if(typeof loadPrayerLoc==="function") loadPrayerLoc(); render(); });
    }).catch(function(){
      // 通信失敗でもログインは保つ
      if(isAdmin){ showAdmin(); return; }
      loadUserData().then(function(){ if(typeof loadPrayerLoc==="function") loadPrayerLoc(); render(); });
    });
  } else {
    showLogin();
  }
}
boot();
</script>
