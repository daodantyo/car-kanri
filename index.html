<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車の管理（公開版）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background:#f1f5f9; color:#1e293b; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 120px; }
  h1 { font-size:20px; margin:0; font-weight:700; }
  .head { display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .logo { width:40px; height:40px; border-radius:12px; background:#1e293b; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .tabs { display:flex; gap:3px; padding:5px; margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab { flex:1 0 auto; min-width:58px; white-space:nowrap; border:none; background:none; border-radius:10px; padding:9px 8px; font-size:12px; font-weight:600; color:#64748b; cursor:pointer; font-family:inherit; }
  .tab.on { background:#1e293b; color:#fff; }
  .monthnav { display:flex; align-items:center; justify-content:space-between; padding:8px; margin-bottom:16px; }
  .monthnav button { border:none; background:none; padding:8px; border-radius:12px; color:#64748b; cursor:pointer; font-size:20px; }
  .monthnav button:hover { background:#f1f5f9; }
  .monthlabel { font-size:18px; font-weight:600; }
  .total { border-radius:16px; padding:20px; color:#fff; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .total.dark { background:#1e293b; } .total.indigo { background:#4f46e5; }
  .total .l { font-size:13px; opacity:.75; } .total .n { font-size:30px; font-weight:700; margin-top:4px; }
  .cats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .catcard { border-radius:16px; padding:16px; border:1px solid; }
  .catcard .l { font-size:13px; font-weight:500; color:#475569; display:flex; gap:6px; align-items:center; }
  .catcard .n { font-size:19px; font-weight:700; margin-top:4px; }
  .sky{background:#f0f9ff;border-color:#bae6fd;} .sky .n{color:#0369a1;}
  .amber{background:#fffbeb;border-color:#fde68a;} .amber .n{color:#b45309;}
  .emerald{background:#ecfdf5;border-color:#a7f3d0;} .emerald .n{color:#047857;}
  .violet{background:#f5f3ff;border-color:#ddd6fe;} .violet .n{color:#6d28d9;}
  .listhead { font-size:13px; font-weight:600; color:#64748b; padding:0 4px; margin-bottom:8px; }
  .empty { border:2px dashed #cbd5e1; border-radius:16px; background:#fff; padding:32px; text-align:center; color:#94a3b8; line-height:1.7; }
  .row { background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:14px; margin-bottom:8px; }
  .rowtop { display:flex; align-items:center; gap:12px; }
  .dot { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; color:#fff; }
  .dot.sky{background:#0ea5e9;} .dot.amber{background:#f59e0b;} .dot.emerald{background:#10b981;} .dot.violet{background:#8b5cf6;}
  .rowmid { flex:1; min-width:0; }
  .chip { display:inline-block; border-radius:999px; padding:2px 8px; font-size:12px; font-weight:500; }
  .chip.sky{background:#e0f2fe;color:#0369a1;} .chip.amber{background:#fef3c7;color:#b45309;} .chip.emerald{background:#d1fae5;color:#047857;} .chip.violet{background:#ede9fe;color:#6d28d9;}
  .date { font-size:12px; color:#94a3b8; margin-left:8px; }
  .memo { font-size:14px; color:#475569; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .amt { font-weight:600; text-align:right; flex-shrink:0; }
  .del { border:none; background:none; padding:6px; border-radius:8px; color:#cbd5e1; cursor:pointer; flex-shrink:0; }
  .del:hover { background:#fef2f2; color:#ef4444; }
  .paybtn { margin-top:12px; width:100%; display:flex; align-items:center; justify-content:center; gap:6px; border:none; background:#ecfdf5; color:#047857; border-radius:12px; padding:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .paybtn:hover { background:#d1fae5; }
  .vcard { background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:16px; margin-bottom:8px; }
  .vtop { display:flex; justify-content:space-between; align-items:flex-start; }
  .vmodel { font-size:18px; font-weight:700; } .vgrade { font-size:14px; color:#64748b; }
  .vmeta { margin-top:12px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:14px; color:#475569; }
  .vcost { margin-top:8px; border-top:1px solid #f1f5f9; padding-top:8px; text-align:right; }
  .docbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; border:2px solid #1e293b; background:#fff; color:#1e293b; border-radius:16px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:16px; font-family:inherit; }
  .docbtn:hover { background:#f8fafc; }
  .fab { position:fixed; left:0; right:0; bottom:0; padding:16px; background:linear-gradient(to top,#f1f5f9 60%,transparent); z-index:10; }
  .fabinner { max-width:640px; margin:0 auto; }
  .addbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; border:none; color:#fff; border-radius:16px; padding:16px; font-size:18px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.15); font-family:inherit; }
  .addbtn.dark{background:#1e293b;} .addbtn.indigo{background:#4f46e5;}
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:640px){ .overlay{align-items:center;} }
  .sheet { width:100%; max-width:640px; background:#fff; border-radius:24px 24px 0 0; padding:20px; max-height:92vh; overflow-y:auto; }
  @media(min-width:640px){ .sheet{border-radius:24px;} }
  .sheethead { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheethead h2 { font-size:18px; margin:0; }
  .xbtn { border:none; background:none; padding:6px; border-radius:8px; color:#94a3b8; cursor:pointer; font-size:20px; }
  label { display:block; font-size:14px; font-weight:500; color:#475569; margin-bottom:4px; }
  input, select { width:100%; border:1px solid #cbd5e1; border-radius:12px; padding:12px 16px; font-size:16px; margin-bottom:16px; font-family:inherit; }
  input:focus, select:focus { outline:none; border-color:#64748b; }
  .catgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .catpick { border:2px solid #e2e8f0; background:#fff; color:#64748b; border-radius:12px; padding:12px; font-size:16px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; }
  .catpick.on.sky{background:#f0f9ff;color:#0369a1;border-color:#0369a1;}
  .catpick.on.amber{background:#fffbeb;color:#b45309;border-color:#b45309;}
  .catpick.on.emerald{background:#ecfdf5;color:#047857;border-color:#047857;}
  .catpick.on.violet{background:#f5f3ff;color:#6d28d9;border-color:#6d28d9;}
  .yeninput { position:relative; }
  .yeninput span { position:absolute; left:16px; top:12px; color:#94a3b8; font-size:18px; }
  .yeninput input { padding-left:36px; }
  .submit { width:100%; border:none; color:#fff; border-radius:16px; padding:16px; font-size:18px; font-weight:600; cursor:pointer; font-family:inherit; }
  .submit.dark{background:#1e293b;} .submit.indigo{background:#4f46e5;}

  /* 書類 */
  .docoverlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; overflow-y:auto; padding:12px; }
  .docmodal { max-width:720px; margin:16px auto; background:#fff; border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .doctypesw { display:grid; grid-template-columns:1fr 1fr; gap:8px; background:#f1f5f9; border-radius:12px; padding:4px; margin-bottom:16px; }
  .doctypesw button { border:none; background:none; border-radius:8px; padding:8px; font-size:14px; font-weight:600; color:#64748b; cursor:pointer; font-family:inherit; }
  .doctypesw button.on { background:#fff; color:#1e293b; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .issuerbox { background:#f8fafc; border-radius:12px; padding:12px; margin-bottom:12px; }
  .issuerbox .t { font-size:14px; font-weight:600; color:#475569; margin-bottom:8px; }
  .issuerbox input { font-size:14px; padding:8px 12px; margin-bottom:8px; }
  .itemrow { border:1px solid #e2e8f0; border-radius:12px; padding:10px; margin-bottom:8px; }
  .itemrow .r1 { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .itemrow select { width:auto; margin:0; padding:6px 8px; font-size:14px; }
  .itemrow .desc { flex:1; min-width:0; margin:0; padding:6px 8px; font-size:14px; }
  .itemrow .r2 { display:flex; gap:8px; align-items:center; font-size:14px; }
  .itemrow .r2 .lbl { color:#94a3b8; }
  .itemrow .qty { width:64px; margin:0; padding:6px 8px; font-size:14px; text-align:right; }
  .itemrow .prc { flex:1; margin:0; padding:6px 8px 6px 24px; font-size:14px; text-align:right; }
  .itemrow .prcwrap { position:relative; flex:1; }
  .itemrow .prcwrap span { position:absolute; left:8px; top:7px; color:#94a3b8; }
  .addrow { width:100%; border:2px dashed #cbd5e1; background:none; border-radius:12px; padding:10px; font-size:14px; font-weight:500; color:#64748b; cursor:pointer; margin-bottom:16px; font-family:inherit; }
  .prevnote { border-top:1px dashed #e2e8f0; padding-top:12px; text-align:center; font-size:12px; color:#94a3b8; margin-bottom:16px; }
  .docbtns { display:flex; gap:8px; margin-top:16px; }
  .docbtns .close { flex:1; border:1px solid #cbd5e1; background:none; border-radius:12px; padding:12px; font-weight:600; color:#475569; cursor:pointer; font-family:inherit; }
  .docbtns .print { flex:2; border:none; background:#1e293b; color:#fff; border-radius:12px; padding:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; }

  /* 書類プレビュー（印刷対象） */
  .sheetpaper { border:1px solid #e2e8f0; border-radius:12px; padding:24px; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .doctitle { text-align:center; font-size:24px; font-weight:700; letter-spacing:8px; margin-bottom:24px; }
  .docheader { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; }
  .docto { border-bottom:2px solid #1e293b; padding-bottom:4px; font-size:18px; font-weight:600; }
  .doclead { font-size:14px; margin-top:12px; }
  .docgrand { margin-top:16px; background:#f1f5f9; border-radius:8px; padding:12px 16px; }
  .docgrand .l { font-size:12px; color:#64748b; } .docgrand .n { font-size:22px; font-weight:700; }
  .docissuer { text-align:right; font-size:12px; line-height:1.7; margin-left:16px; flex-shrink:0; }
  .docissuer .name { font-size:14px; font-weight:600; margin-top:12px; }
  table.doctable { width:100%; border-collapse:collapse; font-size:14px; }
  table.doctable th { border-top:2px solid #1e293b; border-bottom:2px solid #1e293b; padding:6px 4px; }
  table.doctable td { border-bottom:1px solid #e2e8f0; padding:6px 4px; }
  .ta-l{text-align:left;} .ta-r{text-align:right;}
  .doctotals { display:flex; justify-content:flex-end; margin-top:12px; }
  .doctotals .box { width:224px; font-size:14px; }
  .doctotals .line { display:flex; justify-content:space-between; padding:4px 0; }
  .doctotals .grand { border-top:2px solid #1e293b; font-weight:700; font-size:16px; padding:6px 0; }
  .docpay { margin-top:20px; border:1px solid #cbd5e1; border-radius:8px; padding:12px; font-size:14px; }
  .docmemo { margin-top:16px; font-size:12px; color:#64748b; }

  .langsw { display:flex; gap:2px; background:#e2e8f0; border-radius:999px; padding:2px; }
  .langsw button { border:none; background:none; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; color:#64748b; cursor:pointer; font-family:inherit; }
  .langsw button.on { background:#fff; color:#1e293b; }
  .logoutbtn { border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; color:#64748b; cursor:pointer; font-family:inherit; }
  .loginwrap { max-width:400px; margin:50px auto; padding:0 20px; }
  .logincard { background:#fff; border-radius:20px; box-shadow:0 4px 16px rgba(0,0,0,.08); padding:28px 24px; }
  .loginlogo { width:56px; height:56px; border-radius:16px; background:#1e293b; color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 16px; }
  .logintitle { text-align:center; font-size:20px; font-weight:700; margin-bottom:20px; }
  .loginerr { background:#fef2f2; color:#dc2626; border-radius:10px; padding:10px; font-size:14px; text-align:center; margin-bottom:14px; }
  .adminwrap { max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  .usercard { display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:12px 14px; margin-bottom:8px; }
  .praytime { display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:14px 16px; margin-bottom:8px; }
  .praytime.next { outline:2px solid #4f46e5; }
  .prayname { font-weight:600; }
  .praytm { font-size:20px; font-weight:700; }
  .gcalbtn { display:block; text-align:center; margin-top:10px; text-decoration:none; background:#eff6ff; color:#1d4ed8; border-radius:12px; padding:9px; font-size:13px; font-weight:600; }
  .gcalbtn:hover { background:#dbeafe; }
  .photos { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .photothumb { width:72px; height:72px; object-fit:cover; border-radius:8px; cursor:pointer; }
  .photoedit { position:relative; display:inline-block; margin:4px; }
  .photoedit img { width:72px; height:72px; object-fit:cover; border-radius:8px; }
  .photoedit button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:none; background:#ef4444; color:#fff; cursor:pointer; font-size:12px; line-height:1; }
  .mcard { background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; margin-bottom:10px; }
  .mphoto { width:100%; max-height:220px; object-fit:cover; cursor:pointer; display:block; }
  .mbody { padding:12px 14px; position:relative; }
  .mkind { display:inline-block; font-size:11px; font-weight:700; color:#fff; background:#1e293b; border-radius:999px; padding:2px 10px; margin-bottom:6px; }
  .mname { font-size:17px; font-weight:700; }
  .mprice { font-size:16px; font-weight:700; color:#0369a1; margin-top:2px; }
  .mmeta { font-size:13px; color:#64748b; margin-top:2px; }
  .mowner { font-size:12px; color:#94a3b8; margin-top:6px; }
  .mbody .del { position:absolute; top:10px; right:10px; }
  .mktnote { background:#eff6ff; color:#1d4ed8; border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px; line-height:1.5; }
  .itemrow .mcat { width:auto; min-width:66px; max-width:92px; margin:0; padding:6px 8px; font-size:14px; }
  .gsigninbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; border:1px solid #dadce0; background:#fff; border-radius:12px; padding:14px; font-size:16px; font-weight:600; color:#3c4043; cursor:pointer; font-family:inherit; }
  .gsigninbtn:hover { background:#f8f9fa; }
  .mktfilter { display:flex; gap:8px; margin-bottom:12px; }
  .mktfilter select { flex:1; margin:0; padding:10px 12px; font-size:14px; border-radius:12px; }
  .no-print {}
  @media print {
    body { background:#fff; }
    .no-print { display:none !important; }
    .docoverlay { position:static; background:none; padding:0; overflow:visible; }
    .docmodal { max-width:none; margin:0; border-radius:0; box-shadow:none; padding:0; }
    .sheetpaper { border:none; padding:0; }
  }
</style>

function pdg(x){return x*Math.PI/180;} function prd(x){return x*180/Math.PI;}
function dsin(x){return Math.sin(pdg(x));} function dcos(x){return Math.cos(pdg(x));} function dtan(x){return Math.tan(pdg(x));}
function darcsin(x){return prd(Math.asin(x));} function darccos(x){return prd(Math.acos(x));}
function darctan2(y,x){return prd(Math.atan2(y,x));} function darccot(x){return prd(Math.atan2(1,x));}
function fixA(a){a=a-360*Math.floor(a/360); return a<0?a+360:a;}
function fixH(a){a=a-24*Math.floor(a/24); return a<0?a+24:a;}
function julianDate(y,m,d){ if(m<=2){y-=1;m+=12;} const A=Math.floor(y/100), B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){ const D=jd-2451545.0; const g=fixA(357.529+0.98560028*D); const q=fixA(280.459+0.98564736*D); const Ls=fixA(q+1.915*dsin(g)+0.020*dsin(2*g)); const e=23.439-0.00000036*D; const RA=darctan2(dcos(e)*dsin(Ls),dcos(Ls))/15; const decl=darcsin(dsin(e)*dsin(Ls)); const EqT=q/15-fixH(RA); return {decl:decl,EqT:EqT}; }
function timeAngle(angle,lat,decl){ const x=(dsin(angle)-dsin(lat)*dsin(decl))/(dcos(lat)*dcos(decl)); if(x< -1||x>1) return null; return darccos(x)/15; }
function computePrayer(lat,lng,tz,dateObj){
  const y=dateObj.getFullYear(), m=dateObj.getMonth()+1, d=dateObj.getDate();
  const jd=julianDate(y,m,d) - lng/(15*24);
  const sp=sunPos(jd); const decl=sp.decl, eqt=sp.EqT;
  const dhuhr=fixH(12 + tz - lng/15 - eqt);
  function Tm(angle,sign){ const t=timeAngle(angle,lat,decl); if(t===null) return null; return dhuhr + sign*t; }
  const asrA=-darccot(1+dtan(Math.abs(lat-decl)));
  const asrT=timeAngle(asrA,lat,decl);
  return { fajr:Tm(-18,-1), sunrise:Tm(-0.833,-1), dhuhr:dhuhr, asr:(asrT===null?null:dhuhr+asrT), maghrib:Tm(-0.833,1), isha:Tm(-17,1) };
}
function hm(h){ if(h===null||isNaN(h)) return "--:--"; h=fixH(h); let hh=Math.floor(h); let mm=Math.round((h-hh)*60); if(mm===60){mm=0;hh=(hh+1)%24;} return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }

function prayerHtml(){
  let h='';
  h += '<div class="card" style="padding:14px;margin-bottom:16px;">';
  h += '<label>'+t("chooseCity")+'</label>';
  h += '<select onchange="pickCity(this.value)"><option value="">—</option>';
  CITIES.forEach(function(c,i){ const sel=(prayerLoc && prayerLoc.name===cityLabel(c))?" selected":""; h+='<option value="'+i+'"'+sel+'>'+esc(cityLabel(c))+'</option>'; });
  h += '</select>';
  h += '<button class="submit dark" style="margin-top:4px;" onclick="useLocation()">📍 '+t("useLocation")+'</button>';
  h += '</div>';
  if(!prayerLoc) return h;
  const now=new Date();
  const T=computePrayer(prayerLoc.lat,prayerLoc.lng,prayerLoc.tz,now);
  const utcH=now.getUTCHours()+now.getUTCMinutes()/60;
  const localH=fixH(utcH+prayerLoc.tz);
  const only=[["pFajr",T.fajr],["pDhuhr",T.dhuhr],["pAsr",T.asr],["pMaghrib",T.maghrib],["pIsha",T.isha]];
  let nextName=null,nextT=null;
  for(let i=0;i<only.length;i++){ if(only[i][1]!==null && only[i][1]>localH){ nextName=only[i][0]; nextT=only[i][1]; break; } }
  if(nextName===null && only[0][1]!==null){ nextName=only[0][0]; nextT=only[0][1]+24; }
  h += '<div class="total dark" style="text-align:center;"><div class="l">🕌 '+esc(prayerLoc.name)+'</div>';
  if(nextName!==null){ const rem=nextT-localH; const rh=Math.floor(rem), rm=Math.round((rem-rh)*60);
    h += '<div style="font-size:13px;opacity:.85;margin-top:6px;">'+t("nextPrayer")+'：'+t(nextName)+'</div>';
    h += '<div class="n" style="font-size:24px;">'+t("remain")+' '+rh+'h '+String(rm<0?0:rm).padStart(2,"0")+'m</div>'; }
  h += '</div>';
  const all=[["pFajr",T.fajr],["pSunrise",T.sunrise],["pDhuhr",T.dhuhr],["pAsr",T.asr],["pMaghrib",T.maghrib],["pIsha",T.isha]];
  all.forEach(function(row){ const isNext=(row[0]===nextName);
    h+='<div class="praytime'+(isNext?" next":"")+'"><div class="prayname">'+t(row[0])+'</div><div class="praytm">'+hm(row[1])+'</div></div>'; });
  return h;
}

function googleLogin(){
  var provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(function(e){ showLogin((e&&e.message)||"login error"); });
}
async function doLogin(){
  const id = (document.getElementById("login_id").value||"").trim();
  const pw = document.getElementById("login_pass").value||"";
  document.getElementById("app").innerHTML = '<div style="padding:60px 20px;text-align:center;color:#94a3b8;">'+t("loading")+'</div>';
  await fetchAccounts();
  const acc = accounts[id];
  if(!acc || acc.pass !== pw){ showLogin(t("loginErr")); return; }
  currentUser = id; isAdmin = !!acc.admin;
  try{ localStorage.setItem("car-session", JSON.stringify({id:id, admin:isAdmin})); }catch(_){}
  if(isAdmin){ showAdmin(); return; }
  await loadUserData();
  loadPrayerLoc();
  render();
}

function showAdmin(){
  const users = Object.keys(accounts).filter(k=>!accounts[k].admin);
  const list = users.length ? users.map(uid=>{
    const a = accounts[uid];
    return '<div class="usercard"><div style="flex:1;min-width:0;">'
      + '<div style="font-weight:600;">'+esc(a.name||uid)+'</div>'
      + '<div style="font-size:13px;color:#64748b;">ID: '+esc(uid)+' / '+t("loginPass")+': '+esc(a.pass)+'</div>'
      + '</div><button class="del" onclick="delUser(\''+esc(uid)+'\')">🗑</button></div>';
  }).join("") : '<div class="empty">'+t("noCustomers")+'</div>';

async function addUser(){
  const name=(document.getElementById("nu_name").value||"").trim();
  const id=(document.getElementById("nu_id").value||"").trim();
  const pass=(document.getElementById("nu_pass").value||"").trim();
  if(!id||!pass){ alert(t("alUserReq")); return; }
  if(accounts[id]){ alert(t("alUserDup")); return; }
  accounts[id] = { pass:pass, name:name||id };
  await saveAccounts();
  showAdmin();
}
async function delUser(uid){
  if(!confirm(t("confDel"))) return;
  delete accounts[uid];
  await saveAccounts();
  try { await fetch(dataPath(uid), { method:"DELETE" }); } catch(e){}
  showAdmin();
}
async function changeAdminPass(){
  const np=(document.getElementById("ap_new").value||"").trim();
  if(!np) return;
  accounts["admin"].pass = np;
  await saveAccounts();
  alert(t("doneChange"));
  showAdmin();
}
async function save(){
  if(!currentUser) return;
  try { localStorage.setItem(KEY+"_"+currentUser, JSON.stringify(db)); } catch(_){}
  try { await fetch(dataPath(currentUser), { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(db) }); } catch(e){}
}

// ====== 画面状態 ======
const now = new Date();
let ui = { tab:"prayer", y:now.getFullYear(), m:now.getMonth()+1 };
function moveMonth(d){ let y=ui.y, m=ui.m+d; if(m<1){m=12;y--;} if(m>12){m=1;y++;} ui.y=y; ui.m=m; render(); }
function monthKey(){ return ui.y+"-"+String(ui.m).padStart(2,"0"); }
function curList(){
  const src = ui.tab==="estimate" ? db.estimates : db.expenses;
  return src.filter(e=>e.date.startsWith(monthKey())).sort((a,b)=>a.date.localeCompare(b.date));
}

// ====== メイン描画 ======
function render(){
  const isEst = ui.tab==="estimate";
  const isPur = ui.tab==="purchase";

      + '<div class="monthlabel">'+label+'</div>'
      + '<button onclick="moveMonth(1)">›</button></div>';
  }

    const sl = (db.schedules||[]).filter(s=>s.date.startsWith(monthKey())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    html += scheduleListHtml(sl);
  } else if(ui.tab==="parts"){
    const pl = [...(db.parts||[])].sort((a,b)=>b.date.localeCompare(a.date));
    html += partsListHtml(pl);
  } else if(ui.tab==="market"){
    html += marketListHtml();
  } else if(isPur){
    const vs = [...db.vehicles].sort((a,b)=>b.date.localeCompare(a.date));

function tabBtn(key,text){ return '<button class="tab'+(ui.tab===key?" on":"")+'" onclick="setTab(\''+key+'\')">'+text+'</button>'; }
function setTab(t2){ ui.tab=t2; render(); if(t2==="market"){ loadMarket().then(function(){ if(ui.tab==="market") render(); }); } }

// ====== 予定表 ======
function scheduleListHtml(list){
  if(list.length===0){ return '<div class="empty">'+t("noSchedules")+'</div>'; }
  let h="";
  list.forEach(function(s){
    h += '<div class="row"><div class="rowtop">'
      + '<div class="dot sky">📅</div>'
      + '<div class="rowmid"><div><span class="chip sky">'+esc(mmdd(s.date))+(s.time?(' '+esc(s.time)):'')+'</span></div>'

// 予定を Googleカレンダー登録リンクに変換
function gcalUrl(s){
  const d = (s.date||"").split("-").join(""); // YYYYMMDD
  let dates;
  if(s.time){
    const hm = s.time.split(":");
    const startH = String(hm[0]).padStart(2,"0"), startM = String(hm[1]).padStart(2,"0");
    // 1時間の予定として登録
    let eh = (Number(hm[0])+1);
    let ed = d;
    if(eh>=24){ eh=eh-24; const dt=new Date(Number(s.date.slice(0,4)), Number(s.date.slice(5,7))-1, Number(s.date.slice(8,10))+1); ed = dt.getFullYear()+String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0"); }
    const endH = String(eh).padStart(2,"0");
    dates = d+"T"+startH+startM+"00/"+ed+"T"+endH+startM+"00";
  } else {
    dates = d+"/"+d; // 終日
  }
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(s.text||"") + "&dates=" + dates;
}

function readImage(file, cb, max, q){
  max=max||800; q=q||0.7;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      let w=img.width, h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",q));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

    + '<label>'+t("fMileage")+'</label><input type="number" inputmode="numeric" id="v_mileage" placeholder="'+esc(t("phMileage"))+'">'
    + '<label>'+t("fCost")+'</label><div class="yeninput"><span>¥</span><input type="number" inputmode="numeric" id="v_cost" placeholder="0"></div>'

function submitVehicle(){
  const model = document.getElementById("v_model").value.trim();
  if(!model){ alert(t("alModel")); return; }
  db.vehicles.push({
    id:Date.now(), date:document.getElementById("v_date").value, model:model,
    grade:document.getElementById("v_grade").value.trim(),
    mileage:Number(document.getElementById("v_mileage").value)||0,
    cost:Number(document.getElementById("v_cost").value)||0,
    memo:document.getElementById("v_memo").value.trim(), photos:vformPhotos
  });
  save(); closeModal(); render();
}

function openModal(html){ const d=document.createElement("div"); d.id="modal"; d.innerHTML=html; document.body.appendChild(d); }
function closeModal(ev){ if(ev && ev.target!==ev.currentTarget) return; const m=document.getElementById("modal"); if(m) m.remove(); }

// ====== 見積書・請求書 ======
let doc = null;
function openDoc(){
  const list = curList();
  doc = {
    type:"quote", issuer:{ name:"", address:"", tel:"", bank:"" }, to:"", note:"", due:"",
    items: list.length ? list.map(e=>({ category:e.category, desc:e.memo||e.category, qty:1, price:Number(e.amount) }))
                       : [{ category:"部品", desc:"", qty:1, price:0 }]
  };
  renderDoc();
}
function closeDoc(){ const m=document.getElementById("docmodal"); if(m) m.remove(); doc=null; }
function setDocType(ty){ doc.type=ty; renderDoc(); }
function docField(k,v){ doc[k]=v; }
function docIssuer(k,v){ doc.issuer[k]=v; }
function docItem(i,k,v){ doc.items[i][k]=v; renderDocPreviewOnly(); }
function addDocRow(){ doc.items.push({ category:"部品", desc:"", qty:1, price:0 }); renderDoc(); }
function delDocRow(i){ doc.items.splice(i,1); if(doc.items.length===0) doc.items.push({category:"部品",desc:"",qty:1,price:0}); renderDoc(); }
function docCalc(){ const sub = doc.items.reduce((s,it)=>s+Number(it.qty||0)*Number(it.price||0),0); const tax=Math.floor(sub*0.1); return { sub, tax, grand: sub+tax }; }

function renderDoc(){
  const isQ = doc.type==="quote";
  let controls = '<div class="no-print">'
    + '<div class="sheethead"><h2>'+t("docTitle")+'</h2><button class="xbtn" onclick="closeDoc()">✕</button></div>'
    + '<div class="doctypesw"><button class="'+(isQ?"on":"")+'" onclick="setDocType(\'quote\')">'+t("quote")+'</button>'
    + '<button class="'+(!isQ?"on":"")+'" onclick="setDocType(\'invoice\')">'+t("invoice")+'</button></div>'
    + '<label>'+t("to")+'</label><input type="text" value="'+esc(doc.to)+'" placeholder="'+esc(t("phTo"))+'" oninput="docField(\'to\',this.value); syncPrev()">'
    + '<div class="issuerbox"><div class="t">'+t("from")+'</div>'
    + '<input type="text" value="'+esc(doc.issuer.name)+'" placeholder="'+esc(t("phFromName"))+'" oninput="docIssuer(\'name\',this.value); syncPrev()">'
    + '<input type="text" value="'+esc(doc.issuer.address)+'" placeholder="'+esc(t("phFromAddr"))+'" oninput="docIssuer(\'address\',this.value); syncPrev()">'
    + '<input type="text" value="'+esc(doc.issuer.tel)+'" placeholder="'+esc(t("phFromTel"))+'" oninput="docIssuer(\'tel\',this.value); syncPrev()"></div>'
    + '<label>'+t("items")+'</label>' + itemsEditorHtml()
    + '<button class="addrow" onclick="addDocRow()">'+t("addItem")+'</button>';
  if(!isQ){
    controls += '<label>'+t("due")+'</label><input type="date" value="'+esc(doc.due)+'" oninput="docField(\'due\',this.value); syncPrev()">'
      + '<label>'+t("bank")+'</label><input type="text" value="'+esc(doc.issuer.bank)+'" placeholder="'+esc(t("phBank"))+'" oninput="docIssuer(\'bank\',this.value); syncPrev()">';
  }
  controls += '<label>'+t("note")+'</label><input type="text" value="'+esc(doc.note)+'" placeholder="'+esc(t("phNote"))+'" oninput="docField(\'note\',this.value); syncPrev()">'
    + '<div class="prevnote">'+t("prevNote")+'</div></div>';
  const paper = '<div id="docpaper">'+paperHtml()+'</div>';
  const btns = '<div class="no-print docbtns"><button class="close" onclick="closeDoc()">'+t("close")+'</button>'
    + '<button class="print" onclick="makePdf()">'+t("pdf")+'</button></div>';
  let m = document.getElementById("docmodal");
  if(!m){ m=document.createElement("div"); m.id="docmodal"; document.body.appendChild(m); }
  m.innerHTML = '<div class="docoverlay"><div class="docmodal">'+controls+paper+btns+'</div></div>';
}

function itemsEditorHtml(){
  return doc.items.map((it,i)=>{
    return '<div class="itemrow">'
      + '<div class="r1"><input class="mcat" type="text" value="'+esc(it.category)+'" placeholder="'+esc(t("fCategory"))+'" oninput="docItem('+i+',\'category\',this.value)">'
      + '<input class="desc" type="text" value="'+esc(it.desc)+'" placeholder="'+esc(t("phDesc"))+'" oninput="docItem('+i+',\'desc\',this.value)">'
      + '<button class="del" onclick="delDocRow('+i+')">🗑</button></div>'
      + '<div class="r2"><span class="lbl">'+t("qty")+'</span>'
      + '<input class="qty" type="number" inputmode="numeric" value="'+esc(it.qty)+'" oninput="docItem('+i+',\'qty\',this.value)">'
      + '<span class="lbl">'+t("unit")+'</span><div class="prcwrap"><span>¥</span>'
      + '<input class="prc" type="number" inputmode="numeric" value="'+esc(it.price)+'" oninput="docItem('+i+',\'price\',this.value)"></div></div>'
      + '</div>';
  }).join("");
}

function paperHtml(){
  const isQ = doc.type==="quote";
  const { sub, tax, grand } = docCalc();
  const dl = (lang==="ar"||lang==="ur") ? "en" : lang;
  const title = isQ ? td("pTitleQuote") : td("pTitleInvoice");
  const lead = isQ ? td("pLeadQuote") : td("pLeadInvoice");
  const no = (isQ?"Q-":"I-") + todayStr().split("-").join("");
  const toText = (dl==="ja") ? ((esc(doc.to)||"（宛先）")+' <span style="font-size:14px;font-weight:400;">'+td("onchu")+'</span>') : ("To: "+(esc(doc.to)||"(customer)"));
  let rows = doc.items.map(it=>{ return '<tr><td>'+esc(it.category)+'</td><td>'+esc(it.desc)+'</td>'
    + '<td class="ta-r">'+esc(it.qty)+'</td><td class="ta-r">'+yen(it.price)+'</td>'
    + '<td class="ta-r">'+yen(Number(it.qty||0)*Number(it.price||0))+'</td></tr>'; }).join("");
  let pay = "";
  if(!isQ && (doc.due || doc.issuer.bank)){
    pay = '<div class="docpay">'
      + (doc.due? '<div>'+td("dueP")+slash(doc.due)+'</div>':'')
      + (doc.issuer.bank? '<div style="margin-top:4px;">'+td("bankP")+esc(doc.issuer.bank)+'</div>':'')
      + '</div>';
  }
  return '<div class="sheetpaper" dir="ltr">'
    + '<div class="doctitle">'+title+'</div>'
    + '<div class="docheader"><div>'
      + '<div class="docto">'+toText+'</div>'
      + '<div class="doclead">'+lead+'</div>'
      + '<div class="docgrand"><div class="l">'+td("grand")+'</div><div class="n">'+yen(grand)+'</div></div>'
    + '</div><div class="docissuer"><div>'+td("noLbl")+' '+no+'</div><div>'+td("issueDate")+' '+slash(todayStr())+'</div>'
      + '<div class="name">'+(esc(doc.issuer.name)||(dl==="ja"?"（発行元の名前）":"(your name)"))+'</div>'
      + (doc.issuer.address? '<div>'+esc(doc.issuer.address)+'</div>':'')
      + (doc.issuer.tel? '<div>TEL '+esc(doc.issuer.tel)+'</div>':'')
    + '</div></div>'
    + '<table class="doctable"><thead><tr>'
      + '<th class="ta-l">'+td("thCat")+'</th><th class="ta-l">'+td("thDesc")+'</th><th class="ta-r">'+td("thQty")+'</th><th class="ta-r">'+td("thUnit")+'</th><th class="ta-r">'+td("thAmt")+'</th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table>'
    + '<div class="doctotals"><div class="box">'
      + '<div class="line"><span>'+td("subtotal")+'</span><span>'+yen(sub)+'</span></div>'
      + '<div class="line"><span>'+td("tax")+'</span><span>'+yen(tax)+'</span></div>'
      + '<div class="line grand"><span>'+td("totalRow")+'</span><span>'+yen(grand)+'</span></div>'
    + '</div></div>'
    + pay
    + (doc.note? '<div class="docmemo">'+td("noteP")+esc(doc.note)+'</div>':'')
    + '</div>';
}

function makePdf(){
  const el = document.querySelector("#docpaper .sheetpaper");
  if(!el) return;
  if(!window.html2canvas || !window.jspdf){ alert(t("alPdfNot")); return; }
  const isQ = doc.type==="quote";
  const fname = (isQ?"mitsumori_":"seikyu_") + todayStr().split("-").join("") + ".pdf";
  html2canvas(el, { scale:2, backgroundColor:"#ffffff" }).then(function(canvas){
    const img = canvas.toDataURL("image/png");
    const jsPDF = window.jspdf.jsPDF;
    const pdf = new jsPDF("p","mm","a4");
    const pw = 210, ph = 297, iw = pw;
    const ih = canvas.height * pw / canvas.width;
    let heightLeft = ih, position = 0;
    pdf.addImage(img,"PNG",0,position,iw,ih); heightLeft -= ph;
    while(heightLeft > 0){ position -= ph; pdf.addPage(); pdf.addImage(img,"PNG",0,position,iw,ih); heightLeft -= ph; }
    pdf.save(fname);
  }).catch(function(e){ alert(t("alPdfErr")); });
}

function renderDocPreviewOnly(){ const p=document.getElementById("docpaper"); if(p) p.innerHTML = paperHtml(); }
function syncPrev(){ renderDocPreviewOnly(); }
